<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAIL — Student AI Lab</title>
<meta name="description" content="Student AI Lab (SAIL): an 8-hour hands-on artificial intelligence curriculum for students ages 14–18. Interactive slides, live labs, and Student Workbook.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Anybody:wght@700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SAIL — Design Tokens & Theme
   ============================================================ */
:root {
  --navy-900: #101d33;
  --navy-800: #16263f;
  --navy-700: #1d3557;
  --navy-600: #274468;
  --steel:    #457b9d;
  --peri:     #8fa8ff;
  --blue:     #5882ff;
  --mint:     #28e99f;
  --lemon:    #ecffa3;
  --paper:    #f5f4f0;
  --cloud:    #e9e8e2;
  --ink:      #14213a;
  --dim:      rgba(245, 244, 240, 0.65);
  --dimmer:   rgba(245, 244, 240, 0.40);
  --line:     rgba(245, 244, 240, 0.14);
  --line-strong: rgba(245, 244, 240, 0.28);

  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Anybody", "Inter", system-ui, sans-serif;

  --radius: 10px;
  --radius-sm: 6px;
  --gutter: clamp(20px, 4vw, 56px);
  --shadow-1: 0 2px 10px rgba(6, 12, 24, 0.35);
  --shadow-2: 0 10px 34px rgba(6, 12, 24, 0.45);

  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
}

body {
  background: var(--navy-900);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.app { min-height: 100%; }

.dotfield {
  background-image: radial-gradient(rgba(245,244,240,0.10) 1.1px, transparent 1.1px);
  background-size: 14px 14px;
}

a { color: var(--peri); }

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--mint);
  outline-offset: 2px;
  border-radius: 4px;
}

.tag {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mint);
  white-space: nowrap;
}
.tag::before { content: "[ "; color: var(--dimmer); }
.tag::after  { content: " ]"; color: var(--dimmer); }
.tag--quiet { color: var(--dim); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 12px;
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: var(--paper);
  text-decoration: none;
  background: rgba(245,244,240,0.04);
  transition: border-color 160ms var(--ease), background 160ms var(--ease),
              transform 160ms var(--ease);
}
.chip:hover {
  border-color: var(--mint);
  background: rgba(40, 233, 159, 0.08);
  transform: translateY(-1px);
}
.chip .ext { color: var(--mint); font-weight: 700; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 14px;
  border: 1px solid var(--line-strong);
  color: var(--paper);
  text-decoration: none;
  transition: background 160ms var(--ease), border-color 160ms var(--ease),
              transform 160ms var(--ease), color 160ms var(--ease);
}
.btn:hover { border-color: var(--mint); transform: translateY(-1px); }
.btn--primary {
  background: var(--mint);
  border-color: var(--mint);
  color: var(--navy-900);
}
.btn--primary:hover { background: #3df0ac; }
.btn--secondary {
  background: rgba(245,244,240,0.06);
}
.btn--secondary:hover {
  background: rgba(245,244,240,0.12);
}
.btn--icon {
  width: 38px;
  height: 38px;
  padding: 0;
  font-size: 16px;
}
.btn[disabled] { opacity: 0.35; cursor: default; transform: none; }

/* ============================================================
   Landing (Student Dashboard)
   ============================================================ */
.landing {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.landing__inner {
  width: min(1120px, 100%);
  margin: 0 auto;
  padding: 0 var(--gutter);
  flex: 1;
}

.landing__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 26px 0 0;
}
.landing__meta { color: var(--dim); font-size: 13px; letter-spacing: 0.06em; }

/* Shared 4-H SAIL brand in the upper-right of every app view. */
.sail-brand {
  display: block;
  flex: 0 1 auto;
  width: clamp(170px, 25vw, 320px);
  height: auto;
  object-fit: contain;
  object-position: right center;
}
.landing__identity { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.topbar__brand { width: clamp(135px, 17vw, 225px); margin-left: 8px; }
@media (max-width: 600px) {
  .landing__top { align-items: flex-start; }
  .sail-brand { width: clamp(130px, 40vw, 210px); }
  .landing__meta { font-size: 11px; }
  .topbar__brand { width: 118px; margin-left: 0; }
}

.hero {
  padding: clamp(40px, 7vh, 80px) 0 clamp(24px, 4vh, 48px);
  max-width: 780px;
}
.hero h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(40px, 6.5vw, 76px);
  line-height: 1.02;
  letter-spacing: -0.015em;
  margin: 18px 0 16px;
}
.hero h1 .accent { color: var(--mint); }
.hero p {
  color: var(--dim);
  font-size: clamp(16px, 1.5vw, 18.5px);
  max-width: 620px;
  margin: 0 0 28px;
}
.hero__actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.hero__resume { color: var(--dim); font-size: 13px; }

/* ---- modules list ---- */
.map { padding-bottom: 26px; }
.map__head {
  display: grid;
  grid-template-columns: 56px 1fr 150px 170px;
  gap: 18px;
  padding: 0 22px 10px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dimmer);
}

.daycard {
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  display: grid;
  grid-template-columns: 56px 1fr 150px 170px;
  gap: 18px;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 18px 22px;
  margin-bottom: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(180deg, rgba(245,244,240,0.045), rgba(245,244,240,0.02));
  transition: transform 180ms var(--ease), border-color 180ms var(--ease),
              box-shadow 180ms var(--ease), background 180ms var(--ease);
}
.daycard:hover {
  transform: translateY(-2px);
  border-color: var(--line-strong);
  box-shadow: var(--shadow-2);
  background: linear-gradient(180deg, rgba(245,244,240,0.07), rgba(245,244,240,0.03));
}
.daycard--current { border-color: rgba(40,233,159,0.55); }

.daycard__num {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 28px;
  color: var(--accent, var(--mint));
  line-height: 1;
}
.daycard__title {
  display: block;
  font-weight: 700;
  font-size: 16.5px;
  margin: 0 0 4px;
}
.daycard__tagline {
  display: block;
  color: var(--dim);
  font-size: 13.5px;
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.daycard__facts { color: var(--dim); font-size: 12.5px; line-height: 1.7; }

.daycard__status { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.daycard__state { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.daycard__state--done { color: var(--mint); }
.daycard__state--current { color: var(--lemon); }
.daycard__state--todo { color: var(--dimmer); }
.daycard__bar {
  width: 130px;
  height: 4px;
  border-radius: 999px;
  background: rgba(245,244,240,0.12);
  overflow: hidden;
}
.daycard__bar i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--mint);
  transition: width 400ms var(--ease);
}

.landing__grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding-bottom: 60px;
}
.panelcard {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  background: rgba(245,244,240,0.03);
}
.panelcard h2 {
  font-size: 16px;
  font-weight: 700;
  margin: 12px 0 10px;
}
.panelcard p, .panelcard li { color: var(--dim); font-size: 13.5px; }
.panelcard ul { margin: 0; padding-left: 18px; }
.panelcard li { margin-bottom: 7px; }
.panelcard li strong { color: var(--paper); }
.toolstack { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.toolgroup { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.toolgroup:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.toolstack a { justify-content: space-between; }
.toolstack .toolname { font-weight: 700; font-size: 13px; }
.toolstack .tooldesc { color: var(--dim); font-weight: 400; font-size: 12px; }

.landing__footer {
  border-top: 1px solid var(--line);
  color: var(--dimmer);
  font-size: 12.5px;
  padding: 18px var(--gutter);
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.policy-statement {
  flex: 0 0 100%;
  max-width: 1120px;
  margin: 0 auto 12px;
  color: var(--dim);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 400;
  line-height: 1.7;
}
.policy-statement p { margin: 0 0 10px; }
.policy-statement p:last-child { margin-bottom: 0; }
.policy-statement a { color: var(--mint); text-underline-offset: 2px; }
.third-party-notice {
  display: grid;
  flex: 0 0 100%;
  grid-template-columns: minmax(190px, 300px) minmax(0, 1fr);
  align-items: center;
  gap: clamp(16px, 3vw, 36px);
  max-width: 1120px;
  margin: 12px auto 0;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-family: var(--font-body);
  font-size: 12px;
  line-height: 1.7;
  color: var(--dim);
}
.third-party-notice img {
  display: block;
  width: 100%;
  max-width: 300px;
  height: auto;
  padding: 7px;
  background: #fff;
  border-radius: 4px;
}
.third-party-notice p { margin: 0 0 8px; }
.third-party-notice p:last-child { margin-bottom: 0; }
@media (max-width: 650px) {
  .third-party-notice { grid-template-columns: 1fr; }
}
.viewer__footer {
  flex: none;
  border-top: 1px solid var(--line);
  background: var(--navy-800);
  padding: 10px var(--gutter);
  max-height: 135px;
  overflow-y: auto;
}
.viewer__footer .policy-statement { font-size: 11px; margin-bottom: 0; }
.viewer__footer .third-party-notice { font-size: 11px; grid-template-columns: 180px 1fr; }
@media (max-width: 650px) {
  .viewer__footer .third-party-notice { grid-template-columns: 1fr; }
}

@media (max-width: 860px) {
  .map__head { display: none; }
  .daycard { grid-template-columns: 44px 1fr; grid-template-rows: auto auto; }
  .daycard__num { font-size: 24px; }
  .daycard__facts { grid-column: 2; }
  .daycard__status { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; }
  .landing__grid { grid-template-columns: 1fr; }
}

/* ============================================================
   SAIL — Viewer (Student Workspace)
   ============================================================ */
.viewer {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--navy-800);
  flex: none;
  min-height: 56px;
}
.topbar__day {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}
.topbar__title {
  font-weight: 700;
  font-size: 14.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar__section {
  font-size: 12px;
  color: var(--lemon);
  border: 1px solid rgba(236,255,163,0.35);
  border-radius: 999px;
  padding: 2px 10px;
  white-space: nowrap;
}
.topbar__spacer { flex: 1; }
.topbar__tools { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; }
.topbar .chip { padding: 4px 10px; font-size: 12px; white-space: nowrap; }
.topbar__btns { display: flex; gap: 8px; align-items: center; }

.viewer__body {
  flex: 1;
  display: flex;
  min-height: 0;
}

.stagewrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(10px, 2vh, 18px) clamp(12px, 2vw, 24px);
  min-height: 0;
}

.slide {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: calc((100dvh - 120px) * 16 / 9);
  aspect-ratio: 16 / 9;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: var(--shadow-2);
  background: #000;
  outline: 1px solid rgba(245,244,240,0.08);
}
.slide iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: #fff;
}

.stage__callout {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 6px 16px 10px;
  min-height: 36px;
  flex-wrap: wrap;
}
.stage__callout .chip { margin-bottom: 2px; }

/* ---- student notes & practice drawer ---- */
.notes {
  flex: none;
  width: min(450px, 42vw);
  border-left: 1px solid var(--line);
  background: var(--navy-800);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.notes[hidden] { display: none; }

.notes__head {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px 0;
  border-bottom: 1px solid var(--line);
}
.notes__tab {
  padding: 8px 12px 10px;
  font-size: 13px;
  font-weight: 700;
  color: var(--dim);
  border-bottom: 2px solid transparent;
  border-radius: 0;
}
.notes__tab[aria-selected="true"] {
  color: var(--mint);
  border-bottom-color: var(--mint);
}
.notes__head .notes__dl {
  margin-left: auto;
  font-size: 12px;
  color: var(--paper);
  padding: 4px 8px;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  text-decoration: none;
  background: rgba(245,244,240,0.05);
}
.notes__head .notes__dl:hover {
  border-color: var(--mint);
  background: rgba(40,233,159,0.1);
}

.notes__scroll {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 40px;
  scrollbar-width: thin;
  scroll-behavior: smooth;
}

.notesec {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  overflow: hidden;
}
.notesec--active { border-color: rgba(40, 233, 159, 0.6); }
.notesec__head {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  text-align: left;
  padding: 12px 14px;
  font-size: 13px;
  font-weight: 700;
  background: rgba(245,244,240,0.04);
}
.notesec__head::after { content: "+"; color: var(--dimmer); font-weight: 400; }
.notesec--open .notesec__head::after { content: "–"; }
.notesec__body { display: none; padding: 6px 16px 14px; }
.notesec--open .notesec__body { display: block; }

.prose { font-size: 13.5px; color: rgba(245,244,240,0.88); }
.prose h1, .prose h2, .prose h3, .prose h4 {
  font-size: 13.5px;
  letter-spacing: 0.02em;
  color: var(--lemon);
  margin: 16px 0 6px;
}
.prose p { margin: 8px 0; }
.prose em, .prose strong { color: var(--paper); }
.prose ul, .prose ol { padding-left: 20px; margin: 8px 0; }
.prose li { margin: 4px 0; }
.prose a { color: var(--mint); font-weight: 600; text-decoration: underline; }
.prose code {
  background: rgba(245,244,240,0.1);
  padding: 2px 5px;
  border-radius: 4px;
  font-family: monospace;
}
.prose table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  margin: 10px 0;
  display: block;
  overflow-x: auto;
}
.prose th, .prose td {
  border: 1px solid var(--line-strong);
  padding: 6px 8px;
  text-align: left;
  vertical-align: top;
}
.prose th { background: rgba(245,244,240,0.06); color: var(--paper); }

@media (max-width: 1000px) {
  .notes {
    position: fixed;
    top: 56px;
    right: 0;
    bottom: 0;
    width: min(440px, 94vw);
    z-index: 50;
    box-shadow: var(--shadow-2);
  }
}

@media (max-width: 780px) {
  .topbar__section, .topbar__tools { display: none; }
  .slide { max-width: 100%; }
}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
/* ============================================================
   SAIL Student Data
   ============================================================ */
window.SAIL_DATA = {
  days: {},
  index: [
    { day: 1, title: "Foundations of AI, Data, and Prediction", tagline: "What makes an AI tick? The 2-step test, input/output mapping, and slope-intercept form.", minutes: 90, figmaUrl: "https://embed.figma.com/slides/mtfnSXGOZrELRLYYdP4JWB/SAIL-Module-1?node-id=16-2649&embed-host=share" },
    { day: 2, title: "The Linear Prediction Model", tagline: "Slope becomes weight, intercept becomes bias — in Desmos, with your own hands.", minutes: 90, figmaUrl: "https://embed.figma.com/slides/3pU1y6a4yEBN3hFa42LHvB/SAIL-Module-2?node-id=7-1882&embed-host=share" },
    { day: 3, title: "Neural Network Foundations", tagline: "Neurons, layers, and ReLU — connecting weighted sums so your model can finally bend.", minutes: 90, figmaUrl: "https://embed.figma.com/slides/9i8ivnTgLRv4adgSAB7UWU/SAIL-Module-3?node-id=1-22&embed-host=share" },
    { day: 4, title: "Training a Neural Network", tagline: "Loss, learning loops, and webcam training in the live SAIL Architect Lab.", minutes: 90, figmaUrl: "https://embed.figma.com/slides/J74s8Q37LHUDTEGbE1z0J8/SAIL-Module-4?node-id=1-23&embed-host=share" },
    { day: 5, title: "Independent Build & Showcase", tagline: "Design your own experiment, change one variable, test, and present your findings.", minutes: 90, figmaUrl: "https://embed.figma.com/slides/db77m5HCcYD0etjHcFf67U/SAIL-Module-5?node-id=0-39&embed-host=share" }
  ]
};

/* Module 1 */
window.SAIL_DATA.days[1] = {
  day: 1,
  title: "Foundations of AI, Data, and Prediction",
  tagline: "What makes an AI tick?",
  minutes: 90,
  figmaUrl: "https://embed.figma.com/slides/mtfnSXGOZrELRLYYdP4JWB/SAIL-Module-1?node-id=16-2649&embed-host=share",
  tools: [
    { name: "mlu-explain · Linear Regression", url: "https://mlu-explain.github.io/linear-regression/", desc: "Interactive visualization of prediction lines fitting data." },
    { name: "Video · Bias & Variance", url: "https://youtu.be/EuBBz3bI-aA", desc: "Short video explaining model bias and error." }
  ],
  sections: [
    {
      id: "concepts",
      title: "Key Concepts & Definitions",
      html: `
        <p><strong>Artificial Intelligence (AI):</strong> A computer system that improves at a task by learning patterns from data, rather than by following fixed human-written instructions.</p>
        <p><strong>Rule-Based Program:</strong> A program that follows a fixed set of if-this-then-that instructions written entirely by a person.</p>
        <p><strong>The Two-Step Test:</strong></p>
        <ol>
          <li>Did a human write the exact rule? <em>(If yes &rarr; Rule-Based)</em></li>
          <li>Did the system learn the pattern from data? <em>(If yes &rarr; AI)</em></li>
        </ol>
        <hr>
        <p><strong>The 3-Part Framework:</strong></p>
        <ul>
          <li><strong>Data:</strong> Recorded examples the system studied in the past.</li>
          <li><strong>Input:</strong> What you give the system right now.</li>
          <li><strong>Output:</strong> What the system gives back right now.</li>
        </ul>
        <hr>
        <p><strong>Slope-Intercept Form:</strong> <code>y = mx + b</code></p>
        <ul>
          <li><strong>x:</strong> Input value</li>

  "use strict";

    const raw = JSON.stringify(state);

    return { seen: {}, last: null, prefs: { notes: true } };

                      el("span.toolname", { text: name }),
                      el("br"),
                      el("span.tooldesc", { text: use })
                    ),
                    el("span.ext", { text: "↗" })
                  )
                ];
              }).filter(Boolean)
            )
          )
        ),

        el("footer.landing__footer", null,
          SAIL.policyFooter(),
          SAIL.thirdPartyNotice(),
          el("span", { text: "Student AI Lab (SAIL) — 8-Hour Artificial Intelligence Curriculum." }),
          el("span", null,
            el("button.landing__reset", {
              text: "Reset local progress",
              onclick: () => {
                if (window.confirm("Clear all course progress on this device?")) {
                  SAIL.store.reset();
                  SAIL.dom.clear(root);
                  render(root);
                }
              },
            }))))));
  }
  return { render };
})();

/* Notes & Practice Drawer */
SAIL.notes = (function () {
  "use strict";
  const { el } = SAIL.dom;

  function create(dayData) {
    let tab = "concepts";
    const scroll = el("div.notes__scroll");
    const tabs = {
      concepts: el("button.notes__tab", {
        text: "Key Concepts", role: "tab", "aria-selected": "true",
        onclick: () => setTab("concepts"),
      }),
      sheets: el("button.notes__tab", {
        text: "Worksheets", role: "tab", "aria-selected": "false",
        onclick: () => setTab("sheets"),
      }),
    };

    const dlBtn = el("a.notes__dl", {
      href: "./SAIL_Student_Workbook-Final.pdf",
      download: "SAIL-Student-Handbook.pdf",
      text: "Handbook (PDF) ↓"
    });

    const root = el("aside.notes", {
      "aria-label": "Student reference notes",
      hidden: SAIL.store.pref("notes") ? null : "",
    },
      el("div.notes__head", { role: "tablist" }, tabs.concepts, tabs.sheets, dlBtn),
      scroll);

    function sectionBlock(s) {
      const body = el("div.notesec__body", null, el("div.prose", { html: s.html }));
      const head = el("button.notesec__head", {
        onclick: () => block.classList.toggle("notesec--open"),
      }, el("span", { text: s.title }));
      const block = el("section.notesec.notesec--open", null, head, body);
      return block;
    }

    const conceptsContent = dayData.sections.map(sectionBlock);
    const sheetsContent = [
      el("section.notesec.notesec--open", null,
        el("div.notesec__body", null, el("div.prose", { html: dayData.worksheetsHtml })))
    ];

    function renderTab() {
      SAIL.dom.clear(scroll);
      scroll.append(...(tab === "concepts" ? conceptsContent : sheetsContent));
      tabs.concepts.setAttribute("aria-selected", tab === "concepts");
      tabs.sheets.setAttribute("aria-selected", tab === "sheets");
    }

    function setTab(t) {
      if (tab === t) return;
      tab = t;
      renderTab();
      scroll.scrollTop = 0;
    }

    renderTab();
    return { root };
  }
  return { create };
})();

/* Viewer Module */
SAIL.viewer = (function () {
  "use strict";
  const { el, clear } = SAIL.dom;
  let ctx = null;

  function mount(root, day) {
    const dayData = SAIL_DATA.days[day];
    const notes = SAIL.notes.create(dayData);

    const notesBtn = el("button.btn.btn--icon", {
      "aria-label": "Toggle reference panel", title: "Key Concepts & Worksheets",
      "aria-pressed": String(!!SAIL.store.pref("notes")), html: "&#9776;",
      onclick: () => {
        const on = !SAIL.store.pref("notes");
        SAIL.store.pref("notes", on);
        notes.root.hidden = !on;
        notesBtn.setAttribute("aria-pressed", String(on));
      },
    });

    const topbar = el("header.topbar", null,
      el("button.btn.btn--icon", {
        "aria-label": "Back to dashboard", title: "Back to Dashboard", html: "&#8962;",
        onclick: () => SAIL.router.go({ view: "landing" })
      }),
      el("div.topbar__day", null,
        el("span.tag", { text: `Module ${day}` }),
        el("span.topbar__title", { text: dayData.title })),
      el("span.topbar__section", { text: `~${dayData.minutes} mins` }),
      el("div.topbar__spacer"),
      el("div.topbar__tools", null,
        dayData.tools.map((t) => el("a.chip", {
          href: t.url, target: "_blank", rel: "noopener", title: t.desc
        }, t.name, el("span.ext", { text: "↗" })))),
      el("div.topbar__btns", null,
        el("a.chip", {
          href: "./SAIL_Student_Workbook-Final.pdf",
          download: "SAIL-Student-Handbook.pdf",
          title: "Download Student Workbook PDF"
        }, "Handbook PDF", el("span.ext", { text: "↓" })),
        notesBtn
      ),
      el("img.sail-brand.topbar__brand", {
        src: "assets/sail-header-logo.png",
        alt: "Hendricks County 4-H SAIL",
        width: "2048", height: "684", decoding: "async"
      }));

    const stage = el("div.stage");
    const frame = el("div.slide", { role: "region", "aria-label": `Interactive Slides for Module ${day}` });
    const iframe = el("iframe", {
      src: dayData.figmaUrl,
      title: `SAIL Module ${day} Interactive Slides`,
      allowfullscreen: "true",
      loading: "lazy"
    });
    frame.append(iframe);
    stage.append(frame);

    const callout = el("div.stage__callout");
    for (const t of dayData.tools) {
      callout.append(el("a.chip", {
        href: t.url, target: "_blank", rel: "noopener", title: t.desc,
      }, `${t.name}`, el("span.ext", { text: "↗" })));
    }

    const viewerEl = el("div.viewer");
    root.append(viewerEl);
    viewerEl.append(
      topbar,
      el("div.viewer__body", null,
        el("div.stagewrap.dotfield", null, stage, callout),
        notes.root),
      el("footer.viewer__footer", null, SAIL.policyFooter(), SAIL.thirdPartyNotice())
    );

    ctx = { day, dayData, notes, viewerEl };
    SAIL.store.markSeen(day);
  }

  function route(root, day) {
    if (ctx && ctx.day === day && root.querySelector(".viewer")) return;
    ctx = null;
    clear(root);
    mount(root, day);
  }

  function unmount() { ctx = null; }
  return { route, unmount };
})();

/* Initialize Application */
(function () {
  "use strict";
  const root = document.getElementById("app");
  SAIL.router.start(function (route) {
    if (route.view === "module") {
      SAIL.viewer.route(root, route.day);
    } else {
      SAIL.viewer.unmount();
      SAIL.dom.clear(root);
      SAIL.landing.render(root);
      window.scrollTo(0, 0);
    }
  });
})();
</script>
